<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>בואו נטוס לתשובה הנכונה - המשפחה של סול</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0F1D1B; overflow: hidden;
  }

  /* The page is a strip on top and the game underneath it.
     Nothing floats over the game: Wordwall puts the timer, the hearts,
     the menu and the sound button in all four of its corners. */
  body { display: flex; flex-direction: column; }

  .sol-bar {
    flex: 0 0 56px;
    height: 56px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F1D1B;
  }

  .sol-bar-title {
    color: #FFFFFF;
    font-family: "Rubik", "Arial Hebrew", Arial, sans-serif;
    font-size: clamp(15px, 4vw, 20px);
    font-weight: 600;
    padding: 0 64px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Sol home button (unified turquoise) ---------- */
  .sol-home-btn {
    position: absolute;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .sol-home-btn:hover {
    transform: translateY(-50%) scale(1.05);
    box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45);
  }
  .sol-home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
  .sol-home-btn svg { width: 24px; height: 24px; }

  #game-frame {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    border: 0;
    display: block;
  }

  @media (max-width: 640px) {
    .sol-bar { flex-basis: 48px; height: 48px; }
    .sol-home-btn { width: 38px; height: 38px; left: 8px; }
    .sol-home-btn svg { width: 21px; height: 21px; }
    .sol-bar-title { padding: 0 54px; }
  }

  /* On the narrowest phones the strip carries the button only,
     so the title can never push it or wrap. */
  @media (max-width: 420px) {
    .sol-bar-title { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sol-home-btn { transition: none; }
    .sol-home-btn:hover { transform: translateY(-50%); }
  }
</style>
</head>
<body>

<header class="sol-bar">
  <a class="sol-home-btn" href="https://portal.smoove.io/gsbmtbnbbf1yd87kbofd1/Category?category=qqb" target="_top" aria-label="חזרה למסך הבית">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
    </svg>
  </a>
  <span class="sol-bar-title">בואו נטוס לתשובה הנכונה</span>
</header>

<!-- sandbox without allow-popups and without allow-top-navigation:
     Wordwall's own "open on wordwall.net" button used to throw the child
     into a new tab with no history and no way back. Now it does nothing
     and the child stays here, with the home button still on screen. -->
<iframe id="game-frame"
        src="https://wordwall.net/he/embed/1c312a6ac8964ad08f7fec588962efc6?themeId=46&amp;templateId=48&amp;fontStackId=0"
        title="בואו נטוס לתשובה הנכונה"
        sandbox="allow-scripts allow-same-origin allow-forms"
        allow="autoplay; fullscreen"></iframe>

</body>
</html>
